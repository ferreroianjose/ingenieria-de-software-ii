<td class="px-6 py-4 text-sm relative" x-data="{ open: false }">
    <button @click="open = !open" @click.outside="open = false" class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-semibold cursor-pointer hover:opacity-80 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-400
            {% if user.rol == 'ADMIN' %}bg-primary-200 text-primary-800
            {% elif user.rol == 'EMPLEADO' %}bg-secondary-200 text-secondary-800
            {% else %}bg-gray-200 text-gray-700{% endif %}">
        {{ user.get_rol_display }}
        <svg class="w-3 h-3 transform transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>

    <div x-show="open" x-transition:enter="transition ease-out duration-100"
        x-transition:enter-start="transform opacity-0 scale-95" x-transition:enter-end="transform opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-75" x-transition:leave-start="transform opacity-100 scale-100"
        x-transition:leave-end="transform opacity-0 scale-95"
        class="absolute z-10 mt-1 w-40 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none left-4"
        style="display: none;">
        <div class="py-1">
            {% for value, label in roles %}
            {% if user.rol != value %}
            <button hx-post="{% url 'change_user_role' user.id %}" hx-vals='{"rol": "{{ value }}"}'
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-target="closest td" hx-swap="outerHTML"
                @click="open = false"
                class="w-full text-left block px-4 py-2 text-xs text-gray-700 hover:bg-primary-50 hover:text-primary-900 transition-colors">
                Cambiar a {{ label }}
            </button>
            {% endif %}
            {% endfor %}
        </div>
    </div>
</td>
