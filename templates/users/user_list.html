{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto mt-8">
    <h2 class="text-2xl font-bold text-primary-500 mb-6 font-serif">Usuarios registrados</h2>
    <div class="overflow-x-auto rounded-lg shadow-fair-md bg-white">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-primary-100">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-primary-700 uppercase tracking-wider">
                        Nombre</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-primary-700 uppercase tracking-wider">
                        Email</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-primary-700 uppercase tracking-wider">Rol
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-primary-700 uppercase tracking-wider">
                        Acciones</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-100">
                {% for user in users %}
                <tr class="hover:bg-primary-50 transition-colors">
                    <td class="px-4 py-2 text-sm text-gray-900 font-medium">{{ user.get_full_name }}</td>
                    <td class="px-4 py-2 text-sm text-gray-700">{{ user.email }}</td>

                    {% include 'users/user_role_cell.html' %}

                    <td class="px-4 py-2 flex gap-2">
                        <a href="{% url 'delete_user' user.id %}"
                            class="px-3 py-1 rounded bg-red-500 text-white text-xs font-semibold hover:bg-red-600 transition">Eliminar</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="px-4 py-4 text-center text-gray-400">No hay usuarios registrados.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
