{% extends 'base.html' %}
{% block content %}

{%comment%}
Esta mal la carta con el footer!!!!!
{% endcomment %}

<div class="max-w-md mx-auto mt-20 bg-white rounded-lg shadow-fair-md p-6 flex flex-col items-center">
    <h2 class="text-xl font-bold text-red-600 mb-3 font-serif">Eliminar usuario</h2>
    <p class="text-center text-red-700 mb-6">
        ¿Estás seguro de que deseas eliminar al usuario
        <span class="font-semibold">{{ user.get_full_name }}</span>
        <span class="text-gray-500">({{ user.email }})</span>?
    </p>
    <form method="post" class="flex gap-4 w-full justify-center">
        {% csrf_token %}
        <button type="submit"
            class="px-5 py-2 rounded bg-red-500 text-white font-semibold hover:bg-red-600 transition">Eliminar</button>
        <a href="{% url 'manage' %}"
            class="px-5 py-2 rounded bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300 transition">Cancelar</a>
    </form>
</div>
{% endblock %}
