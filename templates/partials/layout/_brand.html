<style>
  .brand-text-container {
    transition: max-width 0.3s, opacity 0.3s, margin 0.3s;
    overflow: hidden;
    white-space: nowrap;
    margin-top: auto;
    margin-bottom: auto;
  }
  .brand-logo-container {
    flex-shrink: 0;
    transition: all 0.35s ease-out;
  }

  @media (min-width: 768px) {
    .brand-text-container {
      max-width: var(--sidebar-width);
    }

    .brand-logo-container {
      width: 5rem;
      height: 5rem;
    }

    body.is-collapsed .brand-text-container {
      max-width: 0px !important;
      opacity: 0 !important;
    }
    body.is-collapsed .brand-logo-container {
      width: 4rem;
      height: 4rem;
    }
    body.is-collapsed .brand-wrapper {
      justify-content: center;
    }
  }
</style>

<a href="/" class="min-h-20 flex flex-row will-change-transform items-center no-underline brand-wrapper {{ class|default:'' }}">
  <img src="/static/favicon.svg" alt="Siempre Gym" class="brand-logo-container {{ logo_class|default:'h-14' }}" />
  <span class="font-sans font-bold tracking-tight text-primary-500 leading-none brand-text-container {{ text_class|default:'text-4xl' }}">SIEMPRE <br>GYM</span>
</a>
