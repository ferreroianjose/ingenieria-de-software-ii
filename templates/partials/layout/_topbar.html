<!-- Mobile Backdrop Overlay -->
<div
  x-show="mobileOpen"
  x-transition.opacity.duration.350ms
  @click="mobileOpen = false"
  class="md:hidden fixed inset-0 z-40 bg-black/60"
  x-cloak
></div>

<!-- Expanding Mobile Topbar -->
<header
  hx-boost="true"
  hx-target="#main-content"
  hx-select="#main-content"
  hx-swap="outerHTML"
  class="md:hidden fixed top-0 left-0 right-0 z-50 shadow-fair-lg flex flex-col overflow-visible topbar-mobile-transition"
  :class="mobileOpen ? 'max-h-[90vh] bg-gray-900 rounded-b-8xl' : 'max-h-[var(--topbar-height)] bg-gray-900 rounded-b-0xl'"
>
  <!-- Always visible header row -->
  <div class="flex flex-row items-center justify-between gap-3 px-3 shrink-0 min-h-[var(--topbar-height)] h-[var(--topbar-height)] bg-gray-900 z-10 overflow-visible">
    {% include 'partials/layout/_brand.html' with class="w-auto h-12 shrink-0" text_class="hidden" %}

    <div class="flex flex-row items-center gap-2 shrink-0 ml-auto">
      {% block _user_pill %}
        {% include 'partials/layout/_user_pill.html' with direction="down" %}
      {% endblock %}

      <button
        @click="mobileOpen = !mobileOpen"
        class="size-[var(--shell-action-size)] shrink-0 rounded-full flex items-center ring-inset justify-center bg-white/10 hover:bg-white/20 transition-colors focus:outline-none"
        :class="mobileOpen ? 'bg-white/15 hover:bg-white/20 text-primary-400 ring-1 ring-white/18' : ''"
        aria-label="Toggle menú"
      >
        <div class="relative flex items-center justify-center size-[var(--shell-action-size)]">
          <span x-show="!mobileOpen" x-transition.opacity.duration.300ms class="absolute inset-0 flex items-center justify-center">
            {% include 'partials/ui/_icon.html' with name="list" class="size-7 text-white" %}
          </span>
          <span x-show="mobileOpen" x-transition.opacity.duration.300ms class="absolute inset-0 flex items-center justify-center" x-cloak>
            <svg class="size-7 text-white" fill="currentColor" viewBox="0 0 16 16">
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
            </svg>
          </span>
        </div>
      </button>
    </div>
  </div>

  <!-- Collapsible body -->
  <div class="flex-1 overflow-y-auto p-5 pt-0 flex flex-col gap-6 hide-scroll transition-[opacity,transform]"
       x-show="mobileOpen"
       x-transition:enter="duration-500"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="duration-400"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       x-cloak>

    <nav class="flex flex-col gap-1 w-full" @click="mobileOpen = false">
      {% include 'partials/layout/_nav_items.html' %}
    </nav>

  </div>
</header>
