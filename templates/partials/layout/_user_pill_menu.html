<style>
  .user-pill-item:not(:last-child) {
    margin-bottom: 0.5rem;
  }
  .user-pill-item a,
  .user-pill-item button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    border-radius: calc(var(--radius-3xl) - 0.5rem);
    font-size: 0.875rem;
    font-weight: 700;
    text-align: left;
    text-decoration: none;
    color: rgb(229 231 235);
    background: rgb(255 255 255 / 0.05);
    transition: background-color 0.15s;
    cursor: pointer;
  }
  .user-pill-item a:hover,
  .user-pill-item button:hover {
    background: rgb(255 255 255 / 0.1);
  }
</style>
<div>
  <div class="user-pill-item">
    <form method="post" action="{% url 'logout' %}" hx-boost="false">
      {% csrf_token %}
      <button type="submit" class="text-white !bg-[#F00]/45 hover:!bg-[#F00]/65">
        {% include 'partials/ui/_icon.html' with name="box-arrow-left" class="size-4 shrink-0" %}
        <span class="whitespace-nowrap">Cerrar sesión</span>
      </button>
    </form>
  </div>
  <div class="user-pill-item">
    <a href="{% url 'settings' %}">
      {% include 'partials/ui/_icon.html' with name="gear" class="size-4 shrink-0" %}
      <span class="whitespace-nowrap">Configuración</span>
    </a>
  </div>
</div>
