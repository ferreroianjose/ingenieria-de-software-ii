{% if messages %}
<ul class="space-y-2">
	{% for message in messages %}
	<li class="rounded-lg px-4 py-2 text-sm font-medium {% if message.tags == 'error' %}bg-red-50 text-red-800{% else %}bg-green-50 text-green-800{% endif %}">
		{{ message }}
	</li>
	{% endfor %}
</ul>
{% elif status_message %}
<ul class="space-y-2">
	<li class="rounded-lg px-4 py-2 text-sm font-medium {% if status_level == 'error' %}bg-red-50 text-red-800{% else %}bg-green-50 text-green-800{% endif %}">
		{{ status_message }}
	</li>
</ul>
{% endif %}
