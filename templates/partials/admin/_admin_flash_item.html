<div class="admin-flash-item admin-flash-item--{% if level == 'error' %}error{% else %}success{% endif %}" role="status">
	<p class="flex-1 min-w-0 leading-snug">{{ text }}</p>
	<button
		type="button"
		class="admin-flash-dismiss"
		aria-label="Cerrar notificación"
		onclick="clearAdminFlash()"
	>
		<svg class="size-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
			<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
		</svg>
	</button>
</div>
