<form
    {% if form_id %}id="{{ form_id }}"{% endif %}
    class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center"
    hx-get="{{ search_url }}"
    hx-target="{{ target_id }}"
    hx-swap="innerHTML"
    hx-trigger="submit"
    hx-on::after-request="if (event.detail.successful) { this.setAttribute('data-searched', '1'); this.removeAttribute('data-show-all'); }"
>
    <input
        type="search"
        name="q"
        value="{{ q|default:'' }}"
        placeholder="{{ placeholder|default:'Buscar…' }}"
        class="flex-1 min-w-0 rounded-full border border-gray-200 px-4 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-400/20"
        autocomplete="off"
    />
    {% if extra_fields %}{{ extra_fields }}{% endif %}
    <button
        type="submit"
        class="btn-auto shrink-0 bg-primary-400 hover:bg-primary-600 text-white py-2 px-6 rounded-full font-bold text-sm transition-colors"
    >
        Buscar
    </button>
</form>
