{% comment %}
  name, value, label; opcional: description, checked
  Misma UI que admin-picker (sedes/salas) con input radio nativo.
{% endcomment %}
<li>
  <label class="admin-picker-item w-full">
    <input
      type="radio"
      class="sr-only"
      name="{{ name }}"
      value="{{ value }}"
      {% if checked %}checked{% endif %}
    >
    <span class="admin-picker-select w-full">
      <span class="admin-select-indicator" aria-hidden="true">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 6l2.5 2.5 4.5-5" />
        </svg>
      </span>
      <span class="min-w-0 flex-1 text-left">
        <span class="picker-option-title block truncate text-sm font-semibold text-gray-900 transition-colors">{{ label }}</span>
        {% if description %}
        <span class="picker-option-desc block truncate text-xs text-gray-500 mt-0.5 transition-colors">{{ description }}</span>
        {% endif %}
      </span>
    </span>
  </label>
</li>
