{# Side drawer: full-height panel from the edge + dimmed backdrop. HTMX → #{{ container_id }}-container #}
<template x-teleport="body">
<div
	x-cloak
	x-show="{{ modal_open_var }}"
	x-init="$watch('{{ modal_open_var }}', open => open ? modalScrollLock.acquire() : modalScrollLock.release())"
	class="relative z-[200]"
	@keydown.escape.window="{{ modal_open_var }} = false"
>
	<div
		x-show="{{ modal_open_var }}"
		x-transition:enter="ease-out duration-300"
		x-transition:enter-start="opacity-0"
		x-transition:enter-end="opacity-100"
		x-transition:leave="ease-in duration-200"
		x-transition:leave-start="opacity-100"
		x-transition:leave-end="opacity-0"
		class="fixed inset-0 z-[200] bg-black/75"
		@click="{{ modal_open_var }} = false"
	></div>

	<div
		role="dialog"
		aria-modal="true"
		x-show="{{ modal_open_var }}"
		x-transition:enter="ease-out duration-300"
		x-transition:enter-start="translate-x-full"
		x-transition:enter-end="translate-x-0"
		x-transition:leave="ease-in duration-200"
		x-transition:leave-start="translate-x-0"
		x-transition:leave-end="translate-x-full"
		class="fixed inset-y-0 right-0 z-[210] flex w-full {{ panel_class|default:'max-w-3xl' }} flex-col overflow-hidden bg-white shadow-2xl outline outline-1 outline-white/25"
		@click.stop
	>
		<div id="{{ container_id }}-container" class="flex h-full min-h-0 flex-col"></div>
	</div>
</div>
</template>
