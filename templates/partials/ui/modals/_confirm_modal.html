{% comment %}
Modal de confirmación global (misma shell que _modal.html). Estado: Alpine.store('gymflowConfirm').
{% endcomment %}
<template x-teleport="body">
<div
	x-cloak
	x-show="$store.gymflowConfirm.open"
	x-init="$watch('$store.gymflowConfirm.open', open => open ? modalScrollLock.acquire() : modalScrollLock.release())"
	class="relative z-[200]"
	@keydown.escape.window="$store.gymflowConfirm.cancel()"
>
	<div
		x-show="$store.gymflowConfirm.open"
		x-transition:enter="ease-out duration-300"
		x-transition:enter-start="opacity-0"
		x-transition:enter-end="opacity-100"
		x-transition:leave="ease-in duration-200"
		x-transition:leave-start="opacity-100"
		x-transition:leave-end="opacity-0"
		class="fixed inset-0 z-[200] bg-black/75"
		@click="$store.gymflowConfirm.cancel()"
	></div>

	<div
		x-show="$store.gymflowConfirm.open"
		class="fixed inset-0 z-[210] w-screen overflow-y-auto"
	>
		<div class="flex min-h-full items-center justify-center p-4 sm:p-6">
			<div
				role="dialog"
				aria-modal="true"
				aria-labelledby="gymflow-confirm-title"
				aria-describedby="gymflow-confirm-message"
				x-show="$store.gymflowConfirm.open"
				x-transition:enter="ease-out duration-300"
				x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
				x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
				x-transition:leave="ease-in duration-200"
				x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
				x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
				@click.outside="$store.gymflowConfirm.cancel()"
				class="relative w-full max-w-md transform overflow-hidden rounded-8xl bg-white text-left shadow-2xl outline outline-1 outline-white/25 transition-all sm:my-8"
			>
				<div class="flex flex-col">
					<header class="flex items-start justify-between gap-4 p-6 pb-0 sm:p-8 sm:pb-0">
						<div class="min-w-0 flex-1 space-y-1">
							<h1 id="gymflow-confirm-title" class="title-impact" x-text="$store.gymflowConfirm.title"></h1>
						</div>
						<button
							type="button"
							class="btn-auto ml-4 shrink-0 rounded-full border-0 bg-gray-200 p-2 text-gray-800 shadow-fair-md hover:bg-gray-100 hover:text-primary-400"
							@click="$store.gymflowConfirm.cancel()"
							aria-label="Cerrar"
						>
							<svg class="size-7" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
								<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
							</svg>
						</button>
					</header>

					<div class="w-full p-6 pt-4 sm:p-8 sm:pt-6">
						<p id="gymflow-confirm-message" class="text-sm text-gray-600 font-normal leading-snug" x-text="$store.gymflowConfirm.message"></p>
					</div>

					<footer class="modal-footer relative flex flex-col items-center justify-end gap-4 overflow-hidden bg-gradient-to-b from-secondary-900 via-secondary-950 via-50% to-black p-6 sm:p-8 isolate [transform:translateZ(0)]">
						{% include 'partials/ui/modals/_modal_footer_glows.html' %}
						<div class="relative z-10 flex w-full flex-col-reverse gap-3 sm:flex-row sm:justify-end sm:gap-4">
							<button
								type="button"
								class="btn-auto w-full rounded-full border-2 border-white/25 bg-transparent px-8 py-2.5 text-sm font-bold text-white hover:bg-white/10 sm:w-auto"
								@click="$store.gymflowConfirm.cancel()"
								x-text="$store.gymflowConfirm.cancelLabel"
							></button>
							<button
								type="button"
								class="btn-auto relative z-10 w-full px-8 py-2.5 font-bold text-white sm:w-auto"
								:class="$store.gymflowConfirm.variant === 'danger' ? 'bg-red-500 hover:bg-red-600' : 'bg-primary-400 hover:bg-primary-600'"
								@click="$store.gymflowConfirm.accept()"
								x-text="$store.gymflowConfirm.confirmLabel"
							></button>
						</div>
					</footer>
				</div>
			</div>
		</div>
	</div>
</div>
</template>
