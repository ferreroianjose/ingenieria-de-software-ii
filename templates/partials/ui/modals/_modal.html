{% with show_var=modal_show_var|default:"modalOpen" %}
{% with container_id=modal_container_id|default:show_var %}
<template x-teleport="body">
<div
	x-cloak
	x-show="{{ show_var }}"
	x-init="$watch('{{ show_var }}', open => open ? modalScrollLock.acquire() : modalScrollLock.release())"
	class="relative z-[200]"
	@keydown.escape.window="{{ show_var }} = false"
	@close-modal.window="{{ show_var }} = false"
>
	<div
		x-show="{{ show_var }}"
		x-transition:enter="ease-out duration-300"
		x-transition:enter-start="opacity-0"
		x-transition:enter-end="opacity-100"
		x-transition:leave="ease-in duration-200"
		x-transition:leave-start="opacity-100"
		x-transition:leave-end="opacity-0"
		class="fixed inset-0 z-[200] bg-black/75"
		@click="{{ show_var }} = false"
	></div>

	<div
		x-show="{{ show_var }}"
		class="fixed inset-0 z-[210] w-screen overflow-y-auto"
	>
		<div class="flex min-h-full items-center justify-center p-4 sm:p-6">
			<div
				role="dialog"
				aria-modal="true"
				x-show="{{ show_var }}"
				x-transition:enter="ease-out duration-300"
				x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
				x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
				x-transition:leave="ease-in duration-200"
				x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
				x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
				@click.outside="{{ show_var }} = false"
				class="relative w-full transform overflow-hidden rounded-8xl bg-white text-left shadow-2xl outline outline-1 outline-white/25 transition-all sm:my-8 {% block modal_max_width %}max-w-md{% endblock %}"
			>
				<div
					id="{{ container_id }}-container"
					class="flex flex-col [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-bold [&_label]:text-gray-700"
				>
					{% block modal_form_container %}
					<form
						id="{{ container_id }}-form"
						method="POST"
						action="{% if action_url %}{{ action_url }}{% else %}{% block modal_action_url %}{{ request.path }}{% endblock %}{% endif %}"
						hx-post="{% if action_url %}{{ action_url }}{% else %}{{ request.path }}{% endif %}"
						hx-target="#{{ container_id }}-container"
						hx-select="#{{ container_id }}-container"
						hx-swap="outerHTML"
						class="contents"
					>
						{% csrf_token %}
						{% if modal_form_type %}
							<input type="hidden" name="form_type" value="{{ modal_form_type }}">
						{% endif %}

						{% block modal_content %}
						<header class="flex items-start justify-between gap-4 p-6 pb-0 sm:p-8 sm:pb-0">
							<div class="min-w-0 flex-1 space-y-1">
								{% if modal_form and modal_form.errors %}
								<h1 class="title-impact text-red-500">¡Hay un problema!</h1>
								<ul class="mt-2 space-y-1 text-sm font-medium text-red-600">
									{% for field in modal_form %}
										{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
									{% endfor %}
									{% for error in modal_form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
								</ul>
								{% else %}
								<h1 class="title-impact">{% if modal_title_safe %}{{ modal_title|safe }}{% else %}{% block modal_title %}{{ modal_title }}{% endblock %}{% endif %}</h1>
								{% block modal_subtitle %}
								{% if modal_subtitle %}
								<p class="text-sm text-gray-600 font-normal mt-1">{{ modal_subtitle }}</p>
								{% endif %}
								{% endblock %}
								{% endif %}
							</div>
							<button
								type="button"
								class="btn-auto ml-4 shrink-0 rounded-full border-0 bg-gray-200 p-2 text-gray-800 shadow-fair-md hover:bg-gray-100 hover:text-primary-400"
								@click="{{ show_var }} = false"
								aria-label="Cerrar"
							>
								<svg class="size-7" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
									<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
								</svg>
							</button>
						</header>

						<div class="w-full p-6 pt-4 sm:p-8 sm:pt-6">
							{% block modal_body %}
							{% if modal_body_template %}
								{% include modal_body_template with modal_form=modal_form lock_sede=lock_sede selected_sede_id=selected_sede_id %}
							{% endif %}
							{% endblock %}
						</div>

						<footer class="modal-footer relative flex flex-col items-center justify-end gap-4 overflow-hidden bg-gradient-to-b from-secondary-900 via-secondary-950 via-50% to-black p-6 sm:p-8 isolate [transform:translateZ(0)]">
							{% include 'partials/ui/modals/_modal_footer_glows.html' %}
							{% block modal_footer %}
							{% if modal_footer_template %}
								{% include modal_footer_template %}
							{% else %}
							<button type="submit" class="btn-auto relative z-10 bg-primary-400 px-8 py-2.5 font-bold text-white hover:bg-primary-600">
								{{ modal_button_label|default:"Confirmar" }}
							</button>
							{% endif %}
							{% endblock %}
						</footer>
						{% endblock %}
					</form>
					{% endblock %}
				</div>
			</div>
		</div>
	</div>
</div>
</template>
{% endwith %}
{% endwith %}
