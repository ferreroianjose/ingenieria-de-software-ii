<div class="relative inline-block" @mouseenter="showTooltip = true" @mouseleave="showTooltip = false">
  <svg class="size-5 md:size-4 text-gray-500 cursor-help" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10" />
    <path d="M12 16v-4" />
    <path d="M12 8h.01" />
  </svg>
  <div x-show="showTooltip" x-transition
    class="absolute bottom-full -left-16 z-50 w-64 p-4 mb-2 text-md font-normal text-on-light-bg-500 bg-light-bg-500 border border-white/50 rounded-2xl shadow-fair-lg"
    style="display: none;">
    {{ text }}
  </div>
</div>
