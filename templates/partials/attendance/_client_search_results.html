<div class="flex flex-col h-full w-full bg-white">
    <div class="px-6 pt-6 pb-0 shrink-0">
        <h3 class="text-xl font-bold text-gray-900">Resultados de búsqueda</h3>
        <p class="text-sm text-gray-500 font-normal mt-1">Seleccioná un cliente para ver su ficha y registrar asistencia.</p>
    </div>
    
    <div class="p-6 flex-1 overflow-y-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-4">
            {% for user in clientes %}
            <div class="p-4 rounded-lg border border-gray-200 bg-white hover:border-primary-400 hover:shadow-md transition-all cursor-pointer flex justify-between items-center group"
                 hx-get="{% url 'attendance:detail' %}?user_id={{ user.id }}"
                 hx-target="#main-content-container"
                 hx-swap="innerHTML">
                <div class="min-w-0">
                    <h4 class="text-base font-bold text-gray-900 truncate group-hover:text-primary-600 transition-colors">{{ user.get_full_name }}</h4>
                    <p class="text-sm text-gray-500 truncate mt-0.5">{{ user.email }}</p>
                    <p class="text-xs font-semibold text-gray-400 mt-1">DNI: {{ user.dni }}</p>
                </div>
                <div class="shrink-0 h-10 w-10 rounded-full bg-primary-50 text-primary-500 flex items-center justify-center group-hover:bg-primary-500 group-hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </div>
            {% empty %}
            <div class="col-span-full">
                <div class="admin-empty-dashed !m-0 min-h-[11rem] w-full">
                    <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <p class="text-gray-500 text-sm font-medium">No se encontraron clientes con ese criterio.</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
