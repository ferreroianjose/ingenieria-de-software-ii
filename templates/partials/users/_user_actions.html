{% url 'delete_user' 0 as user_delete_url %}

<button
	type="button"
	class="admin-selection-toolbar-btn admin-selection-toolbar-btn--primary"
	@click.prevent="openSelectedUserDrawer()"
	x-text="selectedUserId ? 'Editar' : 'Crear {% if user.rol == "ADMIN" %}usuario{% else %}cliente{% endif %}'"
></button>

<button
	type="button"
	class="admin-selection-toolbar-btn admin-selection-toolbar-btn--secondary"
	:disabled="!selectedUserId"
	@click="openUserDrawer(adminActionUrl('{% url 'classes:student_enrollments_drawer' 0 %}', selectedUserId))"
>
	Ver reservas
</button>

<form x-ref="deleteUserForm" method="post" class="hidden" :action="selectedUserId ? adminActionUrl('{{ user_delete_url }}', selectedUserId) : ''">
	{% csrf_token %}
</form>

<button
	type="button"
	class="admin-selection-toolbar-btn admin-selection-toolbar-btn--danger"
	:disabled="!selectedUserId"
	@click="selectedUserId && window.gymflowConfirm('¿Seguro que querés eliminar a «' + selectedUserLabel + '»?', { variant: 'danger', title: 'Eliminar usuario', confirmLabel: 'Sí, eliminar' }).then(ok => { if (ok) adminHtmxPost($refs.deleteUserForm) })"
>
	Eliminar
</button>
