<template x-teleport="body">
<div
	x-cloak
	x-show="modalOpen"
	x-init="$watch('modalOpen', open => open ? modalScrollLock.acquire() : modalScrollLock.release())"
	class="relative z-[100]"
	@keydown.escape.window="if (!$store.gymflowConfirm.open) { modalOpen = false }"
>
	<div
		x-show="modalOpen"
		x-transition:enter="ease-out duration-300"
		x-transition:enter-start="opacity-0"
		x-transition:enter-end="opacity-100"
		x-transition:leave="ease-in duration-200"
		x-transition:leave-start="opacity-100"
		x-transition:leave-end="opacity-0"
		class="fixed inset-0 z-[100] bg-black/75"
		@click="if (!$store.gymflowConfirm.open) { modalOpen = false }"
	></div>

	<div
		x-show="modalOpen"
		class="fixed inset-0 z-[110] w-screen overflow-y-auto"
	>
		<div class="flex min-h-full items-center justify-center p-4 sm:p-6">
			<div
				role="dialog"
				aria-modal="true"
				x-show="modalOpen"
				x-transition:enter="ease-out duration-300"
				x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
				x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
				x-transition:leave="ease-in duration-200"
				x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
				x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
				class="relative w-full transform overflow-hidden rounded-8xl bg-white text-left shadow-2xl outline outline-1 outline-white/25 transition-all sm:my-8 max-w-5xl"
			>
				<div
					id="qr-modal-container"
					class="flex flex-col [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-bold [&_label]:text-gray-700"
				>
                    <div id="qr-drawer-form" class="contents">
                        <header class="flex items-start justify-between gap-4 p-6 pb-0 sm:p-8 sm:pb-0">
                            <div class="min-w-0 flex-1 space-y-1">
                                <h1 class="title-impact">Resultado del Escáner</h1>
                            </div>
                            <button
                                type="button"
                                class="btn-auto ml-4 shrink-0 rounded-full border-0 bg-gray-200 p-2 text-gray-800 shadow-fair-md hover:bg-gray-100 hover:text-primary-400"
                                @click="modalOpen = false"
                                aria-label="Cerrar"
                            >
                                <svg class="size-7" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </header>

                        <div class="w-full p-6 sm:p-8 flex flex-col">
                            <div id="qr-modal-content" class="w-full min-h-[400px] flex flex-col">
                                <!-- El HTMX inyecta el _client_detail.html aquí -->
                            </div>
                        </div>
                    </div>
				</div>
			</div>
		</div>
	</div>
</div>
</template>
