<div class="dash-membership-item {% if is_future %}dash-membership-item--future{% else %}dash-membership-item--active{% endif %}">
  <div class="dash-membership-item__accent" aria-hidden="true"></div>
  <div class="relative z-10 flex items-start justify-between gap-3 min-w-0">
    <div class="min-w-0">
      <p class="dash-membership-item__title">{{ label }}</p>
      <p class="dash-membership-item__subtitle">{{ subtitle }}</p>
    </div>
  </div>
</div>
