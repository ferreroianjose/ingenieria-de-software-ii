<div class="dash-membership-item {% if is_pending %}dash-membership-item--pending{% elif is_future %}dash-membership-item--future{% else %}dash-membership-item--active{% endif %}">
  <div class="dash-membership-item__accent" aria-hidden="true"></div>
  <div class="relative z-10 flex items-start justify-between gap-3 min-w-0">
    <div class="min-w-0">
      <p class="dash-membership-item__title">{{ label }}</p>
      <p class="dash-membership-item__subtitle">{{ subtitle }}</p>
    </div>
    {% if is_pending %}
      <div class="dash-membership-item__tag" style="background: rgba(255, 196, 86, 0.25); color: #ffe8aa; border-color: rgba(255, 196, 86, 0.4);">Impaga</div>
    {% endif %}
  </div>
</div>
