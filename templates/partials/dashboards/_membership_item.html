<a href="{{ detail_url }}" class="dash-membership-item block !no-underline hover:!no-underline {% if is_pending %}dash-membership-item--pending{% elif is_future %}dash-membership-item--future{% else %}dash-membership-item--active{% endif %}">
  <div class="dash-membership-item__accent" aria-hidden="true"></div>
  <div class="relative z-10 flex items-start justify-between gap-3 min-w-0">
    <div class="min-w-0 flex-1">
      <p class="dash-membership-item__title !text-white">{{ label }}</p>
      <p class="dash-membership-item__subtitle !text-white/70">{{ subtitle }}</p>
    </div>
    {% if is_pending %}
      <span class="dash-chip shrink-0 mt-0.5 ml-auto bg-amber-500/20 text-amber-300 border border-amber-500/30">Impaga</span>
    {% endif %}
  </div>
</a>
