{% if qr_url %}
<div class="flex items-center justify-center size-full relative" x-data="{ qrUrl: '{{ qr_url }}', qrToken: '{{ qr_token }}' }"
     hx-get="{% url 'attendance:generate_qr' %}" hx-trigger="every 300s" hx-swap="none"
     @htmx:after-request.window="if (event.detail.target.id === 'qr-code-img' || event.detail.xhr.status === 200) { 
        try {
            let res = JSON.parse(event.detail.xhr.responseText);
            if (res.qr_url) { qrUrl = res.qr_url; qrToken = res.qr_token; }
        } catch(e) {}
     }">
    <img id="qr-code-img" :src="qrUrl" alt="Código QR de ingreso" class="{{ class|default:'size-full rounded-2xl' }} object-contain" />
</div>
{% else %}
<div class="flex items-center justify-center size-full bg-secondary-950 text-white rounded-2xl p-4 text-center text-xs">
    <span>QR no disponible</span>
</div>
{% endif %}
