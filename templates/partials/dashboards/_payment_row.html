{% comment %}
  Usage:
    {% include 'partials/dashboards/_payment_row.html' with disciplina="..." method="..." amount="..." %}
{% endcomment %}
<div class="dash-payment-row bg-stone-50 rounded-4xl p-4 flex justify-between items-center gap-3 shadow-fair-sm border border-white/25">
    <div class="dash-payment-row__meta flex items-center gap-4 min-w-0">
        <div class="size-10 shrink-0 rounded-8xl ring-2 ring-inset ring-primary-500 flex items-center justify-center text-primary-500 bg-gray-50 shadow-fair-md">
            {% include 'partials/ui/_icon.html' with name="check" class="size-7 stroke-[3]" %}
        </div>
        <div class="min-w-0">
            <p class="font-black text-secondary-900">{{ disciplina }}</p>
            <p class="text-sm font-bold text-gray-400 uppercase tracking-tight">{{ method }}</p>
        </div>
    </div>
    <p class="dash-payment-row__amount font-black text-secondary-900 text-xl">{{ amount }}</p>
</div>
