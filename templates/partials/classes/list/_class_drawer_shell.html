<div
	x-cloak
	x-show="classDrawerOpen"
	class="relative z-[200]"
	@keydown.escape.window="classDrawerOpen = false"
>
	<div
		x-show="classDrawerOpen"
		x-transition:enter="ease-out duration-300"
		x-transition:enter-start="opacity-0"
		x-transition:enter-end="opacity-100"
		x-transition:leave="ease-in duration-200"
		x-transition:leave-start="opacity-100"
		x-transition:leave-end="opacity-0"
		class="fixed inset-0 z-[200] bg-black/75"
		@click="classDrawerOpen = false"
	></div>

	<div
		role="dialog"
		aria-modal="true"
		x-show="classDrawerOpen"
		x-transition:enter="ease-out duration-300"
		x-transition:enter-start="translate-x-full"
		x-transition:enter-end="translate-x-0"
		x-transition:leave="ease-in duration-200"
		x-transition:leave-start="translate-x-0"
		x-transition:leave-end="translate-x-full"
		class="fixed inset-y-0 right-0 z-[210] flex w-full max-w-3xl flex-col overflow-hidden bg-white shadow-2xl outline outline-1 outline-white/25"
		@click.stop
	>
		<div id="class-drawer-container" class="flex h-full min-h-0 flex-col"></div>
	</div>
</div>
