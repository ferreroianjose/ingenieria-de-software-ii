{% extends 'partials/_modal.html' %}

{% block modal_title %}Agregar Sala{% endblock %}
{% block modal_subtitle %}Ingresa los datos de la nueva sala.{% endblock %}

{% block modal_body %}
<div class="space-y-4">
    <div>
        <label>Nombre</label>
        {{ modal_form.nombre }}
    </div>
    <div>
        <label>Capacidad</label>
        {{ modal_form.capacidad }}
    </div>
    <div>
        <label>Sede</label>
        {{ modal_form.sede }}
    </div>
</div>
{% endblock %}
