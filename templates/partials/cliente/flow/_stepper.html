{% comment %}step: actividades | horarios | clase | pago{% endcomment %}
<nav class="cf-stepper" aria-label="Progreso de inscripción" role="list">
  <div class="cf-step" role="listitem">
    <span class="cf-step__dot {% if step == 'actividades' %}is-current{% elif step != 'actividades' %}is-done{% else %}is-todo{% endif %}">1</span>
    <span class="cf-step__label {% if step == 'actividades' %}is-current{% else %}is-done{% endif %}">Actividades</span>
  </div>
  <div class="cf-step__connector" aria-hidden="true"><span class="cf-step__line {% if step != 'actividades' %}is-done{% endif %}"></span></div>
  <div class="cf-step" role="listitem">
    <span class="cf-step__dot {% if step == 'horarios' %}is-current{% elif step == 'clase' or step == 'pago' %}is-done{% else %}is-todo{% endif %}">2</span>
    <span class="cf-step__label {% if step == 'horarios' %}is-current{% elif step == 'clase' or step == 'pago' %}is-done{% endif %}">Horarios</span>
  </div>
  <div class="cf-step__connector" aria-hidden="true"><span class="cf-step__line {% if step == 'clase' or step == 'pago' %}is-done{% endif %}"></span></div>
  <div class="cf-step" role="listitem">
    <span class="cf-step__dot {% if step == 'clase' %}is-current{% elif step == 'pago' %}is-done{% else %}is-todo{% endif %}">3</span>
    <span class="cf-step__label {% if step == 'clase' %}is-current{% elif step == 'pago' %}is-done{% endif %}">Tu clase</span>
  </div>
  <div class="cf-step__connector" aria-hidden="true"><span class="cf-step__line {% if step == 'pago' %}is-done{% endif %}"></span></div>
  <div class="cf-step" role="listitem">
    <span class="cf-step__dot {% if step == 'pago' %}is-current{% else %}is-todo{% endif %}">4</span>
    <span class="cf-step__label {% if step == 'pago' %}is-current{% endif %}">Pago</span>
  </div>
</nav>
