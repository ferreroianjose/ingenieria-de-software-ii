{% if creditos_disponibles is not None %}
<div
  class="relative flex items-center gap-2 rounded-full border border-white/15 bg-black/30 px-3 py-1.5 sm:px-4 sm:py-2 z-20"
  x-data="{ infoOpen: false }"
>
  <span class="text-lg font-black tabular-nums text-primary-300 leading-none">{{ creditos_disponibles }}</span>
  <span class="text-[10px] font-black uppercase tracking-widest text-white/60">
    crédito{{ creditos_disponibles|pluralize }}
  </span>
  <button
    type="button"
    class="ml-0.5 inline-flex shrink-0 items-center justify-center !rounded-none !border-0 !bg-transparent !p-0 !shadow-none font-normal text-white/50 hover:text-primary-300 focus:!ring-0 focus:!ring-offset-0"
    aria-label="Qué son los créditos"
    :aria-expanded="infoOpen"
    @click="infoOpen = !infoOpen"
  >
    <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <circle cx="12" cy="8" r="1" fill="currentColor" stroke="none" />
    </svg>
  </button>
  <div
    x-show="infoOpen"
    x-cloak
    @click.outside="infoOpen = false"
    class="absolute right-0 top-full z-[100] mt-2 w-72 max-w-[calc(100vw-2rem)] rounded-2xl border border-gray-200 bg-white p-4 text-sm text-gray-700 shadow-fair-lg"
  >
    Los créditos se otorgan cuando cancelás una reserva con anticipación. Podés usarlos para abonar clases de la misma disciplina en el período vigente.
  </div>
</div>
{% endif %}
