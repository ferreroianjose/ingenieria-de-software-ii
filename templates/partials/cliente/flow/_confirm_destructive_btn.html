{% comment %}
label, confirm_message — botón outline con confirmación previa al submit.
confirm_title, confirm_label, confirm_cancel_label opcionales.
danger_tint: borde/texto rojo (filas de clase). class: clases extra.
{% endcomment %}
<button
  type="button"
  data-confirm-submit
  data-confirm-variant="danger"
  data-confirm-title="{% if confirm_title %}{{ confirm_title|escape }}{% else %}Confirmar{% endif %}"
  data-confirm-label="{% if confirm_label %}{{ confirm_label|escape }}{% else %}Sí, continuar{% endif %}"
  data-confirm-cancel-label="{% if confirm_cancel_label %}{{ confirm_cancel_label|escape }}{% else %}No, volver{% endif %}"
  data-confirm-message="{{ confirm_message|escape }}"
  class="btn-auto text-center text-sm font-bold focus:ring-0 focus:ring-offset-0 {% if danger_tint %}rounded-full border px-5 py-2.5 transition-colors border-red-400/50 text-red-300 hover:border-red-400/45 hover:bg-red-500/10 hover:text-red-200{% elif variant == 'danger' %}dash-ghost-cta dash-ghost-cta--danger py-2.5{% else %}dash-ghost-cta dash-ghost-cta--filled text-white py-2.5{% endif %} {{ class }}"
>{{ label }}</button>
