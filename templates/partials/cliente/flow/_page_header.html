{% comment %}title, subtitle; acciones vía partials/cliente/flow/_header_actions.html{% endcomment %}
<header class="internal-page-header flex flex-col gap-4">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between sm:gap-6">
    <div class="internal-page-header__title min-w-0 flex-1">
      <h1>{{ title }}</h1>
      {% if subtitle %}
      <p>{{ subtitle }}</p>
      {% endif %}
    </div>
    <div class="internal-page-header__actions flex shrink-0 flex-wrap items-center justify-start gap-2 sm:justify-end">
      {% include 'partials/cliente/flow/_header_actions.html' %}
    </div>
  </div>
  <div id="admin-flash" class="w-full">
    {% include 'partials/admin/_admin_status_banner.html' %}
  </div>
</header>
