{% comment %}title, subtitle; acciones vía partials/cliente/flow/_header_actions.html{% endcomment %}
<header class="internal-page-header relative z-30 flex flex-col gap-4 overflow-visible">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between sm:gap-6">
    <div class="internal-page-header__title min-w-0 flex-1">
      <h1>{{ title }}</h1>
      {% if subtitle %}
      <p>{{ subtitle }}</p>
      {% endif %}
    </div>
    <div class="internal-page-header__actions relative z-40 w-full overflow-visible sm:w-auto sm:shrink-0">
      {% include 'partials/cliente/flow/_header_actions.html' %}
    </div>
  </div>
  <div id="cliente-flash" class="w-full">
    {% include 'partials/cliente/flow/_flash_banner.html' %}
  </div>
</header>
