{% comment %}label, confirm_message — inside a POST form; confirm before submit{% endcomment %}
<button
  type="button"
  data-confirm-submit
  data-confirm-variant="danger"
  data-confirm-title="{% if confirm_title %}{{ confirm_title|escape }}{% else %}Confirmar{% endif %}"
  data-confirm-label="{% if confirm_label %}{{ confirm_label|escape }}{% else %}Sí, continuar{% endif %}"
  data-confirm-cancel-label="{% if confirm_cancel_label %}{{ confirm_cancel_label|escape }}{% else %}No, volver{% endif %}"
  data-confirm-message="{{ confirm_message|escape }}"
  class="z-10 btn-auto absolute inset-y-0 right-0 w-28 border-none rounded-none bg-transparent p-0 text-xs font-bold text-red-300 hover:text-red-200 focus:ring-0 focus:ring-offset-0"
>{{ label }}</button>
<div class="pointer-events-none absolute inset-y-0 right-0 z-0 w-28 bg-gradient-to-l from-red-500/35 to-transparent" aria-hidden="true"></div>
