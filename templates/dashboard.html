{% extends 'base.html' %}

{% block title %}Inicio{% endblock %}

{% block content %}
<div class="h-full w-full flex flex-col justify-center items-center bg-gray-50">
    <div class="">
        <h1 class="text-4xl font-bold text-primary-500 mb-4 font-serif">¡Hola, {{ user.username }}!</h1>
        <p class="text-xl text-gray-600">Bienvenido de nuevo a SIEMPRE GYM.</p>
        <div class="mt-8">
             <form action="{% url 'logout' %}" method="post">
                 {% csrf_token %}
                 <button type="submit" class="text-secondary-500 underline font-medium cursor-pointer">
                     Cerrar sesión
                 </button>
             </form>
        </div>
    </div>
</div>
{% endblock %}
