services:
  db:
    image: postgres:18
    container_name: gymflow_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymflow}
      POSTGRES_DB: ${POSTGRES_DB:-gymflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymflow} -d ${POSTGRES_DB:-gymflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gymflow-network

  web:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: gymflow_web
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "True"
      RUN_MIGRATIONS: "True"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymflow-network

  qcluster:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: gymflow_qcluster
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "True"
      RUN_MIGRATIONS: "False"
      SKIP_INITIAL_DATA: "True"
    command: uv run python manage.py qcluster
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymflow-network


volumes:
  postgres_data: {}

networks:
  gymflow-network:
    driver: bridge
