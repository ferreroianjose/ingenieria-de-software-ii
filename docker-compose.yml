services:
  db:
    image: postgres:18
    container_name: gymflow_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymflow}
      POSTGRES_DB: ${POSTGRES_DB:-gymflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymflow} -d ${POSTGRES_DB:-gymflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gymflow-dev-web

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: gymflow_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    networks:
      - gymflow-dev-web

volumes:
  postgres_data: {}

networks:
  gymflow-dev-web:
    driver: bridge
