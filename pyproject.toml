[project]
name = "GYMFLOW"
version = "0.1.0"
description = "Sistema de gestion para el centro de actividades físicas Siempre GYM."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
  "django>=6.0.5",                 # framework base
  "django-browser-reload>=1.21.0", # live reloading
  "django-cors-headers>=4.9.0",    # cors headers para http reqs
  "django-q2>=1.10.0",
  "psycopg[binary]>=3.3.4",        # postgre connector
  "python-dotenv>=1.2.2",          # load variables from .env
]

[tool.pyright]
venvPath = "."
venv = ".venv"
